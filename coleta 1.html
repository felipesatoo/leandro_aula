<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dados do Cliente - Div's Burguer</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .container {
                background-color: #fff;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                max-width: 500px;
                width: 100%;
                text-align: center;
            }
            h1, h2 {
                color: #333;
                margin-bottom: 20px;
            }
            form {
                text-align: left;
            }
            label {
                font-weight: bold;
                display: block;
                margin-bottom: 5px;
                color: #555;
            }
            input[type="text"],
            input[type="email"],
            input[type="tel"] {
                width: 100%;
                padding: 10px;
                margin-bottom: 15px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
                font-size: 16px;
            }
            button {
                background-color: #ff9900;
                color: #fff;
                border: none;
                padding: 12px 20px;
                font-size: 18px;
                border-radius: 4px;
                cursor: pointer;
                transition: background-color 0.3s;
                width: 100%;
            }
            button:hover {
                background-color: #e68a00;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Hamburgueria Div's Burguer</h1>
            </header>
            <main>
                <section>
                    <h2>Dados do Cliente</h2>
                    <form action="produtos.php" method="post">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                        <br/>
                        <label for="sobrenome">Sobrenome:</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required>
                        <br/>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                        <br/>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
                        <br/>
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, número" required>
                        <br/>
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, casa">
                        <br/>
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Seu bairro" required>
                        <br/>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
                        <br/>
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" placeholder="Seu estado" required>
                        <br/>
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" placeholder="XXXXX-XXX" required pattern="[0-9]{5}-[0-9]{3}">
                        <br/>
                        <button type="submit">Próximo</button>
                    </form>
                </section>
            </main> 
        </div>
    </body>
</html>
